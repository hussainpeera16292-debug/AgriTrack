function notes(){const n=[],t=Date.now();S.crops.forEach(c=>{const d=(new Date(c.harvestDate)-t)/864e5;if(c.status!=='Harvested'&&d>=0&&d<=45)n.push(`🌾 ${c.cropName} harvest due in ${Math.ceil(d)} days`)});const li=S.irrigation.map(i=>i.date).sort().pop();if(li)n.push(`💧 Last irrigation logged on ${li}`);const st=stats();if(st.mp[5]<0)n.push('⚠️ This month is running at a loss');return n.length?n:['All caught up']}
const log=m=>{S.log.unshift(m);S.log=S.log.slice(0,8)};
function go(p){page=p;pop='';q='';flt='';render();scrollTo(0,0)}
let lp;function cnt(el){const t=el.textContent,m=t.match(/[\d,]+(\.\d+)?/);if(!m||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const n=+m[0].replace(/,/g,''),pre=t.slice(0,m.index),suf=t.slice(m.index+m[0].length),t0=performance.now();(function f(now){const k=Math.min(1,(now-t0)/900),v=Math.round(n*(1-Math.pow(1-k,3)));el.textContent=pre+v.toLocaleString('en-IN')+suf;if(k<1)requestAnimationFrame(f)})(t0)}
function render(){document.documentElement.dataset.theme=dark?'dark':'light';const r=$('#root');r.innerHTML=page==='land'?land():page==='auth'?authV():app();if(lp!==page){r.classList.remove('in');void r.offsetWidth;r.classList.add('in');r.querySelectorAll('.kpi b').forEach(cnt);setTimeout(()=>r.classList.remove('in'),1300)}lp=page}
const tgl=`<button class="btn g sm" onclick="dark=!dark;render()" aria-label="Toggle dark mode">${'🌓'}</button>`;
function land(){const st=stats();return`<div class="wrap"><nav class="top"><span class="logo">🌾 AgriTrack</span><span style="display:flex;gap:.5rem">${tgl}<button class="btn g" onclick="go('auth')">Log in</button></span></nav>
<div class="hero"><div><h1>Smart Farming Starts Here</h1><p>Manage crops, expenses, irrigation, harvests, and profitability from one platform.</p><button class="btn" onclick="go('auth')">Get Started</button> <button class="btn g" onclick="demo()">Demo Dashboard</button></div>
${hero(st)}</div>
<section class="l"><h2>Everything your farm records, in one place</h2><div class="grid g3">${[['🌾','Crop planner','Track sowing to harvest dates and status for every crop.'],['🚜','Land records','Area, soil and water source for each plot.'],['💰','Expense ledger','Categorised costs with monthly summaries.'],['💧','Irrigation log','Drip, sprinkler or flood schedules by field.'],['📦','Harvest & revenue','Quantity × price, calculated for you.'],['📈','Profit analytics','Revenue minus expenses, month by month.']].map(f=>`<div class="card"><div style="font-size:1.6rem">${f[0]}</div><h3>${f[1]}</h3><p class="mu">${f[2]}</p></div>`).join('')}</div></section>
<section class="l"><h2>Why farmers switch</h2><div class="grid g3"><div class="card"><h3>Know your margin</h3><p class="mu">See which crops pay and which only look busy.</p></div><div class="card"><h3>Never miss a date</h3><p class="mu">Alerts for upcoming harvests and irrigation gaps.</p></div><div class="card"><h3>Works on a phone</h3><p class="mu">Log expenses from the field, export reports at home.</p></div></div></section>
<section class="l"><div class="grid g3"><div><div class="big">12,400+</div><span class="mu">acres tracked</span></div><div><div class="big">18%</div><span class="mu">average cost savings reported</span></div><div><div class="big">3 min</div><span class="mu">to log a week of work</span></div></div></section>
<section class="l"><h2>From the field</h2><div class="grid g2"><div class="card">“I finally saw that tomato earned twice what cotton did per acre.”<br><b>Ravi K., Medak</b></div><div class="card">“Monthly expense summary saved me hours at loan time.”<br><b>Lakshmi P., Siddipet</b></div></div><p class="mu">Testimonials are sample content for this demo.</p></section>
<footer class="mu" style="padding:2rem 0;border-top:1px solid var(--bd)">© 2026 AgriTrack · Smart Farm Management System</footer></div>`}
function hero(st){const L=[...Array(9)].map((_,i)=>`<line x1="${i*58-6}" y1="380" x2="${230+(i-4)*9}" y2="262"/>`).join('');return`<div class="hv"><svg viewBox="0 0 460 380" role="img" aria-label="Farm field with a barn at sunrise"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9f1dc"/><stop offset="1" stop-color="#fff6dc"/></linearGradient><radialGradient id="sn"><stop offset="0" stop-color="#ffe082"/><stop offset="1" stop-color="#ffe082" stop-opacity="0"/></radialGradient></defs><rect width="460" height="380" fill="url(#sk)"/><circle cx="340" cy="90" r="80" fill="url(#sn)"/><circle cx="340" cy="90" r="30" fill="#ffd54f"/><path d="M0 230Q90 170 200 215T460 200V380H0Z" fill="#A5D6A7"/><path d="M0 255Q120 205 250 245T460 230V380H0Z" fill="#66BB6A"/><rect x="52" y="190" width="70" height="52" fill="#b5533c"/><path d="M44 192L87 158L130 192Z" fill="#8d3b2a"/><rect x="76" y="212" width="22" height="30" fill="#f5e6d3"/><rect x="132" y="170" width="20" height="72" rx="4" fill="#e0d3c0"/><path d="M130 172Q142 156 154 172Z" fill="#9e9e9e"/><path d="M0 262H460V380H0Z" fill="#2E7D32"/><g stroke="#A5D6A7" stroke-width="2.5" opacity=".75">${L}</g><g fill="#1B5E20"><circle cx="400" cy="214" r="18"/><rect x="397" y="224" width="6" height="22"/><circle cx="430" cy="224" r="13"/><rect x="427" y="232" width="6" height="16"/></g></svg><div class="fl" style="left:8px;top:30px"><span class="mu">Net profit, 6 months</span><b>${fmt(st.P)}</b></div><div class="fl" style="right:8px;bottom:96px"><span class="mu">Soil moisture</span><b>64%</b><i class="mb"><u style="width:64%"></u></i></div><div class="fl" style="left:24px;bottom:24px"><span class="mu">Next harvest</span><b>🍅 12 days</b></div></div>`}
function spark(a){const mx=Math.max(1,...a),mn=Math.min(0,...a),y=v=>26-(v-mn)/((mx-mn)||1)*24;return`<svg width="84" height="28" viewBox="0 0 84 28" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85" points="${a.map((v,i)=>(i*16.4+1)+','+y(v)).join(' ')}"/></svg>`}
const pc=(a,b)=>b?Math.round((a-b)/Math.abs(b)*100):0,chip=p=>`<em class="tr ${p<0?'dn':'up'}">${p<0?'▼':'▲'} ${Math.abs(p)}%</em>`;
const IV={Drip:3,Sprinkler:5,Flood:10},TIPS=[['💧','Irrigate between 5 and 8 am to cut evaporation loss.'],['🌱','Rotate pulses after cereals to restore soil nitrogen.'],['🐛','Scout leaves for pests twice a week; early spots are cheap to treat.'],['🧪','Test soil pH each season before buying fertilizer.'],['🧾','Log every expense the same day to protect your margin.'],['☁️','Skip irrigation when rain above 50% is forecast.'],['🚜','Service equipment before peak season, not during it.'],['📦','Grade produce before the mandi; better grades fetch better prices.']];
function irrDue(){const m={};S.irrigation.forEach(r=>{if(!m[r.fieldName]||r.date>m[r.fieldName].date)m[r.fieldName]=r});const t0=new Date().setHours(0,0,0,0);return Object.values(m).map(r=>({r,d:Math.round((new Date(r.date).getTime()+(IV[r.type]||5)*864e5-t0)/864e5)})).sort((a,b)=>a.d-b.d).slice(0,4)}
function irrDone(i){const r=S.irrigation[i];S.irrigation.push({...r,date:new Date().toISOString().slice(0,10)});log(`Irrigated ${r.fieldName} (${r.type})`);save();render()}
function dash2(){const st=stats(),ex=st.me,mr=st.mr,mp=st.mp,hk=byMonth(S.harvest,'harvestDate','quantity'),h=now.getHours(),pred=mp.slice(-3).reduce((a,b)=>a+b,0)/3+(mp[5]-mp[3])/2,dd=Math.floor(Date.now()/864e5);
const K=(ic,l,v,sub,c='')=>`<div class="card kpi gk ${c}"><div class="ic">${ic}</div><div><b>${v}</b><span>${l}</span></div><div class="gs">${sub}</div></div>`;
return`<div class="stagebox"><div class="sh"><div><h2>Good ${h<12?'morning':h<17?'afternoon':'evening'}, ${me().name.split(' ')[0]}</h2><p>Your farm at a glance · ${now.toLocaleDateString('en-IN',{dateStyle:'long'})}</p></div><div class="sa"><span class="gp">🌤 28°C · Partly cloudy</span><span class="gp">🔮 Next month ≈ ${fmt(pred)}</span><button class="gq" onclick="go('expenses');edit('expenses',-1)">+ Expense</button><button class="gq" onclick="go('harvest');edit('harvest',-1)">+ Harvest</button></div></div>
<div class="grid stage">${K('🌾','Total crops',S.crops.length,`<span>${S.crops.filter(c=>c.status==='Growing').length} growing</span>`)+K('🚜','Total lands',S.lands.length,`<span>${sum(S.lands,'area')} acres</span>`)+K('💰','Total expenses',fmt(st.E),chip(pc(ex[5],ex[4]))+spark(ex))+K('📦','Total harvest',Math.round(sum(S.harvest,'quantity')).toLocaleString('en-IN')+' kg',chip(pc(hk[5],hk[4]))+spark(hk))+K('📈','Net profit',fmt(st.P),chip(pc(mp[5],mp[4]))+spark(mp),'pf')}</div></div>
<div class="grid g2" style="margin-top:1.2rem"><div class="card"><div class="ch2"><div><h3>Expense trend</h3><span class="mu">Last 6 months</span></div><div style="text-align:right"><span class="big2">${fmt(ex[5])}</span><br>${chip(pc(ex[5],ex[4]))} <span class="mu">vs last month</span></div></div>${line([ex],['#c0392b'])}</div>
<div class="card"><div class="ch2"><div><h3>Harvest analytics</h3><span class="mu">Quantity harvested per month</span></div><div style="text-align:right"><span class="big2">${Math.round(hk[5]).toLocaleString('en-IN')} kg</span><br>${chip(pc(hk[5],hk[4]))} <span class="mu">vs last month</span></div></div>${bars(hk,'#4CAF50')}</div></div>
<div class="grid g3" style="margin-top:1.2rem"><div class="card"><h3>💧 Upcoming irrigation</h3>${irrDue().map(({r,d})=>`<div class="rm"><div><b>${r.fieldName}</b><br><span class="mu">${r.type} · ${r.duration} min · ${r.source}</span></div><span style="text-align:right"><span class="pill ${d<0?'od':d===0?'td':''}">${d<0?'Overdue '+(-d)+'d':d===0?'Due today':'In '+d+' days'}</span><br><button class="btn g sm" style="margin-top:.3rem" onclick="irrDone(${S.irrigation.indexOf(r)})">Mark done</button></span></div>`).join('')||'<p class="mu">No irrigation logged yet. Add a schedule under Irrigation.</p>'}</div>
<div class="card"><h3>💡 Today's farming tips</h3>${[0,3,6].map(i=>TIPS[(dd+i)%8]).map(t=>`<div class="tip"><i>${t[0]}</i><span>${t[1]}</span></div>`).join('')}</div>
<div class="card"><h3>🕒 Recent activities</h3>${S.log.map(l=>`<div class="tl"><i></i>${l}</div>`).join('')}</div></div>`}
let reg=false;
function authV(){return`<div class="auth card"><h2>${reg?'Create account':'Welcome back'}</h2><p class="mu">${reg?'Start tracking your farm.':'Log in to your farm dashboard.'}</p><form onsubmit="return authGo(event)">${reg?'<label>Name<input name="name" required></label>':''}<label>Email<input name="email" type="email" required></label><label>Password<input name="pw" type="password" minlength="6" required></label>${reg?'<label>Role<select name="role"><option>Farmer</option><option>Admin</option></select></label>':''}<button class="btn" style="width:100%">${reg?'Register':'Log in'}</button></form><p style="text-align:center"><a href="#" onclick="reg=!reg;render();return false">${reg?'Have an account? Log in':'New here? Register'}</a> · <a href="#" onclick="demo();return false">Try demo</a></p><p class="mu" style="font-size:12px">Demo build: accounts are stored in this browser only; passwords are SHA-256 hashed.</p></div>`}
async function authGo(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),h=await sha(f.pw),em=f.email.toLowerCase();if(reg){if(S.users.some(u=>u.email===em))return alert('Email already registered'),false;S.users.push({name:f.name,email:em,hash:h,role:f.role});S.me=em}else{const u=S.users.find(u=>u.email===em&&u.hash===h);if(!u)return alert('Wrong email or password'),false;S.me=em}save();go('dashboard');return false}
function demo(){if(!S.users.some(u=>u.email==='demo@agritrack.app'))S.users.push({name:'Ravi Kumar',email:'demo@agritrack.app',hash:'',role:'Admin'});S.me='demo@agritrack.app';save();go('dashboard')}
const me=()=>S.users.find(u=>u.email===S.me)||{name:'Guest',role:'Farmer'};
function app(){if(!S.me){page='auth';return authV()}const u=me(),nav=[['dashboard','📊','Dashboard'],...Object.keys(M).map(k=>[k,M[k].i,M[k].t]),['profit','📈','Profit'],...(u.role==='Admin'?[['users','👥','Users']]:[])];
const hits=q?Object.keys(M).flatMap(k=>S[k].map((r,i)=>({k,i,r})).filter(x=>JSON.stringify(x.r).toLowerCase().includes(q.toLowerCase()))).slice(0,6):[];
return`<div class="app"><aside><span class="logo" style="padding:.4rem .8rem 1rem">🌾 AgriTrack</span>${nav.map(n=>`<a class="${page===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</a>`).join('')}<a style="margin-top:auto" onclick="S.me=null;save();go('land')">🚪 Log out</a></aside>
<main><div class="bar"><div class="sr" style="position:relative"><input placeholder="Search across all records…" value="${q.replace(/"/g,'&quot;')}" oninput="q=this.value;sr(this)" id="gs">${hits.length?`<div class="pop" style="left:0;right:auto">${hits.map(h=>`<div style="cursor:pointer" onclick="go('${h.k}')">${M[h.k].i} <b>${h.r.cropName||h.r.landName||h.r.title||h.r.fieldName}</b> <span class="mu">in ${M[h.k].t}</span></div>`).join('')}</div>`:''}</div>
<span style="position:relative"><button class="btn g sm" onclick="pop=pop==='n'?'':'n';render()" aria-label="Notifications">🔔 ${notes().length}</button>${pop==='n'?`<div class="pop">${notes().map(n=>`<div>${n}</div>`).join('')}</div>`:''}</span>${tgl}<span class="pill">${u.name} · ${u.role}</span></div>
${page==='dashboard'?dash2():page==='profit'?profitV():page==='users'?usersV():crud(page)}</main></div>`}
function sr(el){const p=el.selectionStart;render();const n=$('#gs');n.focus();n.setSelectionRange(p,p)}
function kpi(i,l,v){return`<div class="card kpi"><div class="ic">${i}</div><div><b>${v}</b><span>${l}</span></div></div>`}
function dash(){const st=stats(),cd={};S.crops.forEach(c=>cd[c.cropName]=(cd[c.cropName]||0)+(+c.area||0));
const avg=st.mp.slice(-3).reduce((a,b)=>a+b,0)/3,pred=Math.max(avg+(st.mp[5]-st.mp[3])/2,-1e9);
return`<div class="hd"><div><h2>Good ${now.getHours()<12?'morning':now.getHours()<17?'afternoon':'evening'}, ${me().name.split(' ')[0]}</h2><span class="mu">Here is how your farm is doing today</span></div><span class="pill">${now.toLocaleDateString('en-IN',{dateStyle:'medium'})}</span></div><div class="grid g3">${kpi('🌾','Total crops',S.crops.length)+kpi('🚜','Total lands',S.lands.length)+kpi('💧','Irrigation records',S.irrigation.length)+kpi('💰','Total expenses',fmt(st.E))+kpi('📦','Total harvest',Math.round(sum(S.harvest,'quantity')).toLocaleString()+' kg')+kpi('📈','Net profit',fmt(st.P))}</div>
<div class="grid g2" style="margin-top:1rem"><div class="card"><h3>Expense trend</h3>${line([st.me],['#c0392b'])}</div><div class="card"><h3>Revenue trend</h3>${line([st.mr],['#2E7D32'])}</div><div class="card"><h3>Harvest analytics</h3>${bars(byMonth(S.harvest,'harvestDate','quantity'),'#4CAF50')}</div><div class="card"><h3>Crop distribution (by area)</h3>${donut(Object.entries(cd))}</div>
<div class="card"><h3>🌤 Weather</h3><div class="big">28°C</div><span class="mu">Partly cloudy · humidity 64% · 20% chance of rain</span><p class="mu" style="font-size:12px">Sample data – connect a weather API in production.</p></div>
<div class="card"><h3>🔮 Profit prediction</h3><div class="big">${fmt(pred)}</div><span class="mu">Projected next-month profit from your 3-month trend</span></div>
<div class="card"><h3>💡 Smart farming tips</h3><div class="feed"><div>Irrigate drip crops early morning to cut evaporation by up to 30%.</div><div>Rotate pulses after cereals to restore soil nitrogen.</div><div>Log every expense the day it happens – margins hide in small costs.</div></div></div>
<div class="card"><h3>Recent activity</h3><div class="feed">${S.log.map(l=>`<div>${l}</div>`).join('')}</div></div></div>`}
function crud(k){const m=M[k],cols=m.f.map(f=>f[0]),sel=m.f.find(f=>f[2]==='sel'),rows=S[k].map((r,i)=>({r,i})).filter(x=>(!q||JSON.stringify(x.r).toLowerCase().includes(q.toLowerCase()))&&(!flt||(x.r[sel[0]]===flt)));
const all=k==='harvest'?[...cols,'revenue']:cols,lab=Object.fromEntries(m.f.map(f=>[f[0],f[1]]));lab.revenue='Revenue';
let extra='';if(k==='expenses'){const mm=byMonth(S.expenses,'date','amount');extra=`<div class="card" style="margin-bottom:1rem"><h3>Monthly summary</h3>${bars(mm,'#81C784').replace(/ kg/g,'')}</div>`}
if(k==='harvest')extra=`<div class="card" style="margin-bottom:1rem"><b>Total revenue: ${fmt(sum(S.harvest,'revenue'))}</b></div>`;
return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:.5rem;flex-wrap:wrap"><h2>${m.i} ${m.t}</h2><span style="display:flex;gap:.5rem"><select onchange="flt=this.value;render()" aria-label="Filter" style="width:auto"><option value="">All ${sel[1].toLowerCase()}s</option>${sel[3].map(o=>`<option ${o===flt?'selected':''}>${o}</option>`).join('')}</select><button class="btn g noprint" onclick="print()">⬇ Export PDF</button><button class="btn" onclick="edit('${k}',-1)">+ Add</button></span></div>${extra}
<div class="card tw"><table><tr>${all.map(c=>`<th>${lab[c]}</th>`).join('')}<th></th></tr>${rows.map(x=>`<tr>${all.map(c=>`<td>${MONEY.includes(c)?fmt(x.r[c]):c==='status'?`<span class="pill">${x.r[c]}</span>`:x.r[c]??''}</td>`).join('')}<td><button class="btn g sm" onclick="edit('${k}',${x.i})">Edit</button> <button class="btn d sm" onclick="del('${k}',${x.i})">Delete</button></td></tr>`).join('')||`<tr><td colspan="9" class="mu">No records yet. Click “Add” to create one.</td></tr>`}</table></div>`}
function edit(k,i){const m=M[k],r=i<0?{}:S[k][i];$('#dlg').innerHTML=`<h3 style="margin-bottom:1rem">${i<0?'Add':'Edit'} ${m.t.toLowerCase().replace(/s$/,'')}</h3><form onsubmit="return sv(event,'${k}',${i})">${m.f.map(f=>`<label>${f[1]}${f[2]==='sel'?`<select name="${f[0]}">${f[3].map(o=>`<option ${r[f[0]]===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="${f[0]}" type="${f[2]}" value="${r[f[0]]??''}" ${f[2]==='number'?'min="0" step="any"':''} ${f[0]==='description'?'':'required'}>`}</label>`).join('')}<div style="display:flex;gap:.5rem;justify-content:flex-end"><button type="button" class="btn g" onclick="$('#dlg').close()">Cancel</button><button class="btn">Save</button></div></form>`;$('#dlg').showModal()}
function sv(e,k,i){e.preventDefault();const r=Object.fromEntries(new FormData(e.target));M[k].f.forEach(f=>{if(f[2]==='number')r[f[0]]=+r[f[0]]});if(k==='harvest')r.revenue=r.quantity*r.sellingPrice;i<0?S[k].push(r):S[k][i]=r;log(`${i<0?'Added':'Updated'} ${M[k].t.toLowerCase()}: ${r.cropName||r.landName||r.title||r.fieldName}`);save();$('#dlg').close();render();return false}
function del(k,i){if(!confirm('Delete this record?'))return;const r=S[k].splice(i,1)[0];log(`Deleted ${M[k].t.toLowerCase()}: ${r.cropName||r.landName||r.title||r.fieldName}`);save();render()}
function profitV(){const st=stats();return`<div style="display:flex;justify-content:space-between;margin-bottom:1rem"><h2>📈 Profit analytics</h2><button class="btn g noprint" onclick="print()">⬇ Export PDF</button></div><div class="grid g3">${kpi('📦','Total revenue',fmt(st.R))+kpi('💰','Total expenses',fmt(st.E))+kpi('📈','Net profit',fmt(st.P))}</div><div class="grid g2" style="margin-top:1rem"><div class="card"><h3>Revenue vs expenses</h3>${line([st.mr,st.me],['#2E7D32','#c0392b'])}<span class="mu"><span style="color:#2E7D32">●</span> Revenue <span style="color:#c0392b">●</span> Expenses</span></div><div class="card"><h3>Monthly profit</h3><table>${ML.map((l,i)=>`<tr><td>${l}</td><td style="color:${st.mp[i]<0?'var(--red)':'var(--p)'}"><b>${fmt(st.mp[i])}</b></td></tr>`).join('')}</table></div></div>`}
function usersV(){return`<h2 style="margin-bottom:1rem">👥 Users</h2><div class="card tw"><table><tr><th>Name</th><th>Email</th><th>Role</th></tr>${S.users.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td><span class="pill">${u.role}</span></td></tr>`).join('')}</table></div>`}
render();
</script></body></html>
